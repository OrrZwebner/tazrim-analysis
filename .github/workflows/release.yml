name: release

# Packages the skill on its own and attaches it to the release, so a
# non-technical user can download one file and upload it. GitHub's own
# "Download ZIP" is not usable for this: it contains the whole repository,
# which buries SKILL.md several levels deep.
#
# Replace SKILL_NAME below with the generated skill's folder name.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  SKILL_NAME: tazrim-analysis

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the skill archive
        run: |
          cd skills
          zip -r "../${SKILL_NAME}.zip" "${SKILL_NAME}" \
            -x '*.DS_Store' '*__pycache__*' '*.pyc'

      - name: Verify the archive layout
        run: |
          unzip -l "${SKILL_NAME}.zip"
          # SKILL.md must sit directly inside one top-level folder, or the
          # upload will not be recognized as a skill.
          unzip -l "${SKILL_NAME}.zip" | grep -q " ${SKILL_NAME}/SKILL.md$" \
            || { echo "::error::SKILL.md is not at the expected path in the archive"; exit 1; }
          # every reference and script that exists in the tree must be present
          while IFS= read -r f; do
            rel="${f#skills/}"
            unzip -l "${SKILL_NAME}.zip" | grep -q " ${rel}$" \
              || { echo "::error::missing from archive: ${rel}"; exit 1; }
          done < <(find "skills/${SKILL_NAME}" -type f \
                     \( -path '*/references/*' -o -path '*/scripts/*' -o -path '*/assets/*' \))

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${SKILL_NAME}.zip" \
            --title "$GITHUB_REF_NAME" \
            --notes "Ready-to-upload skill archive. Download \`${SKILL_NAME}.zip\` below and upload it at claude.ai → Customize → Skills. See the README." \
            || gh release upload "$GITHUB_REF_NAME" "${SKILL_NAME}.zip" --clobber
